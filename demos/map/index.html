<!DOCTYPE html>
<html lang="en">
<head>
<title>Cartolina JS: A trivial map application (supports styles with placeholders)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../../build/cartolina.js"></script>
<link href="../../build/cartolina.css" rel="stylesheet"/>
<style>
  body { margin: 0; padding: 0; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
<div id="map"></div>
<script>

const translationDict = {
  backend: {
    dev:  'http://localhost:3071',
    test: 'http://localhost/mapproxy',
    prod: 'https://cdn.tspl.re/mapproxy'
  }
};

const defaultParams = {
  backend: 'prod'
};

function posFromURL() {
  const url = new URL(window.location.href);
  const params = new URLSearchParams(url.search);

  let pos = params.get('pos');
  if (!pos) return null;

  let pos_ = pos.split(',');

  for (let i = 1; i < pos_.length; i++) {
    if (i !== 3) pos_[i] = parseFloat(pos_[i]);
  }

  return pos_;
}

function getSearchParams() {
  return new URLSearchParams(window.location.search);
}

function resolveStyleUrl(styleValue) {
  const normalizedStyle = styleValue || 'default';

  if (/^[a-zA-Z0-9_-]+$/.test(normalizedStyle)) {
    return `./styles/${normalizedStyle}.json`;
  }

  return normalizedStyle;
}

function resolvePlaceholderValue(identifier, params) {
  const rawValue = params.get(identifier) ?? defaultParams[identifier];
  if (rawValue == null) return '';

  const dict = translationDict[identifier];
  if (!dict) return rawValue;

  return Object.prototype.hasOwnProperty.call(dict, rawValue) ? dict[rawValue] : rawValue;
}

function expandStyleTemplate(styleText, params) {
  return styleText.replace(/__([a-zA-Z0-9_-]+)__/g, (match, identifier) => {
    return resolvePlaceholderValue(identifier, params);
  });
}

function loadCompatibilityEntry() {
  if (window.cartolinaCompat) return Promise.resolve();

  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = '../../build/cartolina-compat.js';
    script.onload = resolve;
    script.onerror = () => reject(new Error(
      `Failed to load compatibility entry "${script.src}".`));
    document.head.appendChild(script);
  });
}

/**
 * Rewrites relative source URLs in a parsed style to absolute URLs,
 * resolving them against the URL the style was retrieved from. URLs
 * that are already absolute are left unchanged.
 */
function absolutizeSourceUrls(style, baseUrl) {
  if (!style || typeof style.sources !== 'object') return;

  for (const source of Object.values(style.sources)) {
    if (source && typeof source.url === 'string') {
      source.url = new URL(source.url, baseUrl).href;
    }
  }
}

async function loadStyle(params) {
  const styleUrl = resolveStyleUrl(params.get('style'));

  const response = await fetch(styleUrl);
  if (!response.ok) {
    throw new Error(`Failed to load style "${styleUrl}": ${response.status} ${response.statusText}`);
  }

  const styleText = await response.text();
  const expandedStyleText = expandStyleTemplate(styleText, params);

  let style;

  try {
    style = JSON.parse(expandedStyleText);
  } catch (e) {
    throw new Error(`Expanded style is not valid JSON: ${e.message}`);
  }

  // The style is fetched as text and handed to the map factory as a
  // parsed object, so the factory never sees the style's own URL and
  // would resolve relative source paths against this demo's URL. Make
  // those paths absolute here, against the URL the style came from.
  const absoluteStyleUrl = new URL(styleUrl, window.location.href).href;

  absolutizeSourceUrls(style, absoluteStyleUrl);

  return style;
}

async function main() {
  const params = getSearchParams();
  const hasStyle = params.has('style');
  const mapConfigUrl = params.get('mapConfig');

  if (hasStyle && mapConfigUrl) {
    throw new Error(
      'Specify either ?style= or ?mapConfig=, not both.'
    );
  }

  const options = cartolina.runtimeOptionsFromUrl({
    positionInUrl: true,
    mapExposeFpsToWindow: true
  });

  if (!hasStyle && mapConfigUrl) {
    // legacy mapConfigs load through the compatibility converter,
    // loaded on demand from its own entry point; every legacy dev URL
    // is thereby a living converter regression
    await loadCompatibilityEntry();
    const conversion = await cartolinaCompat.mapConfigToStyle(mapConfigUrl);

    for (const note of conversion.notes) {
      console.log(`mapConfigToStyle note [${note.code}] ${note.path}: ${note.message}`);
    }
    for (const warning of conversion.warnings) {
      console.warn(`mapConfigToStyle warning [${warning.code}] ${warning.path}: ${warning.message} (${warning.recovery})`);
    }

    const urlPos = posFromURL();

    window.v = cartolina.map({
      container: 'map',
      style: conversion.style,
      position: urlPos ?? conversion.position ?? undefined,
      options: { ...conversion.viewerOptions, ...options }
    });
    return;
  }

  let position = [
    'obj', -118.302348, 36.560197, 'fix',
    3313.32, -133.38, -25.09, 0.00, 33347.92, 45.00
  ];

  position = posFromURL() || position;
  const style = await loadStyle(params);

  // the viewer handle, exposed for console experiments
  window.v = cartolina.map({
    container: 'map',
    style: style,
    position: position,
    options: options
  });
}

main().catch((error) => {
  console.error(error);
});

</script>
</body>
</html>
